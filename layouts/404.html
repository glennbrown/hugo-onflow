{{ define "body-class" }}page-error{{ end }}

{{ define "main" }}
{{ partial "layout/header.html" . }}

<main class="content" id="content">
  <h1>Page Not Found</h1>

  <div class="card-content">
    <h2>404</h2>
    <p>{{ i18n "not_found" }}</p>
  </div>

  <a href="{{ .Site.BaseURL }}" class="button">
    {{ partial "icons/arrow-left.html" . }}
    <span class="label">{{ i18n "back_to_home" }}</span>
  </a>
</main>

{{ partial "layout/footer.html" . }}
{{ end }}
